plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    // Add extra repositories here if a dependency needs one
}

loom {
    // No split environments / access wideners needed for this test mod yet
}

dependencies {
    // 26.x is unobfuscated: no mappings line, and plain implementation (no mod*)
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc:fabric-api:${project.fabric_version}"
}

java {
    // Generate a separate -sources.jar alongside the playable mod JAR
    withSourcesJar()

    // Minecraft 26.3 runs on Java 25
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

processResources {
    inputs.property "version", project.version

    // TEMPORARY DIAGNOSTIC: exclude all custom recipes to test Safe Mode.
    exclude "data/slotmachine/recipe/**"

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}
