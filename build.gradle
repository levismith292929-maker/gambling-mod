plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    // Fabric Loom supplies the Fabric Maven repository.
}

loom {
    // No split environments / access wideners needed for this test mod yet
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

def generatedCardResources = layout.buildDirectory.dir("generated/resources/playingcards/main")

tasks.register("generatePlayingCardAssets") {
    outputs.dir(generatedCardResources)

    doLast {
        def outputRoot = generatedCardResources.get().asFile
        if (outputRoot.exists()) {
            outputRoot.deleteDir()
        }

        def archiveUrl = new URL("https://github.com/AustinGabriel/Public-Domain-and-CC0-Playing-Cards/archive/refs/heads/main.zip")
        def connection = archiveUrl.openConnection()
        connection.setConnectTimeout(20000)
        connection.setReadTimeout(60000)

        def standardCardCount = 0
        def jokerCount = 0
        def zip = new java.util.zip.ZipInputStream(connection.getInputStream())
        try {
            java.util.zip.ZipEntry entry
            while ((entry = zip.nextEntry) != null) {
                def path = entry.name.replace('\\\\', '/')
                def standardMatcher = path =~ /.*png cards\\/card fronts\\/(clubs|diamonds|hearts|spades)\\/([^\\/]+)\\.png$/
                def jokerMatcher = path =~ /.*png cards\\/card fronts\\/jokers\\/(red|black) joker\\.png$/

                if (!entry.directory && (standardMatcher.matches() || jokerMatcher.matches())) {
                    def cardName
                    if (jokerMatcher.matches()) {
                        cardName = "joker_" + jokerMatcher.group(1)
                        jokerCount++
                    } else {
                        cardName = standardMatcher.group(2).toLowerCase(Locale.ROOT).replace(' ', '_')
                        standardCardCount++
                    }

                    def textureFile = new File(outputRoot, "assets/slotmachine/textures/item/cards/${cardName}.png")
                    textureFile.parentFile.mkdirs()
                    textureFile.withOutputStream { out ->
                        byte[] buffer = new byte[8192]
                        int read
                        while ((read = zip.read(buffer)) > 0) out.write(buffer, 0, read)
                    }

                    def modelFile = new File(outputRoot, "assets/slotmachine/models/item/cards/${cardName}.json")
                    modelFile.parentFile.mkdirs()
                    modelFile.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson([
                        parent: "minecraft:item/generated",
                        textures: [layer0: "slotmachine:item/cards/${cardName}"]
                    ]))

                    def itemFile = new File(outputRoot, "assets/slotmachine/items/cards/${cardName}.json")
                    itemFile.parentFile.mkdirs()
                    itemFile.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson([
                        model: [type: "minecraft:model", model: "slotmachine:item/cards/${cardName}"]
                    ]))
                }
                zip.closeEntry()
            }
        } finally {
            zip.close()
        }

        if (standardCardCount != 52 || jokerCount != 2) {
            throw new GradleException("Expected 52 standard card images and 2 original Joker images, but downloaded ${standardCardCount} standard cards and ${jokerCount} Jokers.")
        }

        // Generate a paper-shaped blank card: vanilla-paper silhouette with a warmer yellow tint.
        def blankTexture = new File(outputRoot, "assets/slotmachine/textures/item/blank_card.png")
        blankTexture.parentFile.mkdirs()
        def image = new java.awt.image.BufferedImage(16, 16, java.awt.image.BufferedImage.TYPE_INT_ARGB)
        def random = new Random(7319)
        for (int y = 1; y < 15; y++) {
            for (int x = 2; x < 14; x++) {
                boolean edge = x == 2 || x == 13 || y == 1 || y == 14
                int variation = random.nextInt(9) - 4
                int red = Math.max(0, Math.min(255, (edge ? 218 : 250) + variation))
                int green = Math.max(0, Math.min(255, (edge ? 195 : 235) + variation))
                int blue = Math.max(0, Math.min(255, (edge ? 139 : 190) + variation))
                image.setRGB(x, y, (255 << 24) | (red << 16) | (green << 8) | blue)
            }
        }
        javax.imageio.ImageIO.write(image, "png", blankTexture)


    }
}

sourceSets.main.resources.srcDir(generatedCardResources)

tasks.named("sourcesJar") {
    dependsOn tasks.named("generatePlayingCardAssets")
}

processResources {
    dependsOn tasks.named("generatePlayingCardAssets")
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}
